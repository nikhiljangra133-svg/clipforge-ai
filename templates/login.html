<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipForge AI | Private Login</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:grid;
 place-items:center;padding:20px;
 background:#0b1020;color:#f4f6ff;
 font-family:Arial,sans-serif
}
.card{
 width:100%;max-width:420px;padding:32px;
 background:#151d33;border:1px solid #293653;
 border-radius:22px;box-shadow:0 20px 60px #0005
}
.logo{font-size:30px;font-weight:bold;margin-bottom:8px}
.logo span{color:#8b7aff}
.muted{color:#aab5ce;line-height:1.6}
label{display:block;margin:20px 0 8px}
input{
 width:100%;padding:15px;border-radius:12px;
 border:1px solid #344363;background:#0e1629;
 color:white;font-size:16px
}
button{
 width:100%;padding:15px;margin-top:24px;
 border:0;border-radius:12px;background:#6c5ce7;
 color:white;font-size:17px;font-weight:bold
}
.error{
 background:#472333;color:#ffc1ce;
 padding:12px;border-radius:10px;margin-top:15px
}
</style>
</head>
<body>
<main class="card">
 <div class="logo">⚡ ClipForge <span>AI</span></div>
 <p class="muted">Private workspace. Sign in to continue.</p>

 {% with messages = get_flashed_messages() %}
 {% for message in messages %}
 <div class="error">{{ message }}</div>
 {% endfor %}
 {% endwith %}

 <form method="POST" action="/login">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Username</label>
  <input name="username" autocomplete="username"
   placeholder="Enter username" required>

  <label>Password</label>
  <input type="password" name="password"
   autocomplete="current-password"
   placeholder="Enter password" required>

  <button type="submit">Sign In →</button>
 </form>

 <p class="muted" style="text-align:center;margin-top:25px">
  🔒 Authorized access only
 </p>
</main>
</body>
</html>
